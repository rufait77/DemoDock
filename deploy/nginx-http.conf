# Initial HTTP configuration. Use Certbot's nginx installer to add TLS and redirects.
server {
    listen 80;
    listen [::]:80;
    server_name demodock.rufaitlabs.cloud;
    root /var/www/demodock/current;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'none'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /mockServiceWorker.js {
        expires -1;
        try_files $uri =404;
    }
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    location /downloads/ {
        expires -1;
        try_files $uri =404;
    }
    # The demo never has a real API upstream. Unmocked requests cannot mutate a server.
    location /api/ {
        default_type application/json;
        return 404 '{"message":"No server API. Demo data is handled in your browser."}';
    }
    location ~ /\. { deny all; }
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
